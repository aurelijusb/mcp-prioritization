name: Netlify PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  # Pin the Netlify CLI version so it can be cached across runs.
  # Bump this to upgrade — the cache invalidates automatically.
  NETLIFY_CLI_VERSION: "26.1.0"

# Cancel an in-progress preview build when a PR is updated again,
# so superseded runs don't keep burning Actions minutes.
concurrency:
  group: netlify-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: MCP smoke test — tools/list
        run: |
          npx -y @modelcontextprotocol/inspector --cli npx tsx src/stdio.ts \
            --method tools/list | grep -q human_prioritization

      - name: MCP smoke test — ui:// resource
        run: |
          npx -y @modelcontextprotocol/inspector --cli npx tsx src/stdio.ts \
            --method resources/read --uri "ui://prioritization/list.html" \
            | grep -q "profile=mcp-app"

      - name: Cache Netlify CLI
        id: netlify-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.netlify-cli
          key: netlify-cli-${{ runner.os }}-${{ env.NETLIFY_CLI_VERSION }}

      - name: Install Netlify CLI
        if: steps.netlify-cli-cache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.netlify-cli netlify-cli@${{ env.NETLIFY_CLI_VERSION }}

      - name: Add Netlify CLI to PATH
        run: echo "$HOME/.netlify-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Deploy Preview to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          # Unique alias per PR (stable across updates)
          ALIAS="pr-${{ github.event.pull_request.number }}"

          # Deploy a draft/preview (no --prod)
          OUT=$(netlify deploy \
            --alias "$ALIAS" \
            --message "PR #${{ github.event.pull_request.number }} - ${{ github.sha }}" \
            --json)

          echo "$OUT"

          # Extract deploy_url from JSON
          DEPLOY_URL=$(node -p 'JSON.parse(process.argv[1]).deploy_url' "$OUT")
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ toJson(steps.netlify.outputs.deploy_url) }}`.replace(/"/g, '');
            const prNumber = context.payload.pull_request.number;

            const body = [
              "✅ **Netlify Preview Deployed**",
              "",
              `**Preview URL:** ${url}`,
              `**MCP endpoint:** ${url}/mcp`,
              `**Commit:** ${context.sha.substring(0, 7)}`
            ].join("\n");

            // Try to update an existing comment from this workflow, else create one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const marker = "✅ **Netlify Preview Deployed**";
            const existing = comments.find(c => c.user.type === "Bot" && c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
